<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff9fc4;
    --pink-dark: #ff7aa8;
    --white: #ffffff;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #ffd6e6;
    overflow: hidden;
    font-family: "Press Start 2P", monospace;
  }
  #stage {
    position: fixed;
    inset: 0;
    background: url("assets/bg.jpg") center / cover no-repeat;
    image-rendering: pixelated;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    cursor: pointer;
  }
  #char {
    position: absolute;
    left: 50%;
    bottom: 2vh;
    transform: translateX(-50%);
    height: 62vh;
    max-width: 90vw;
    object-fit: contain;
    image-rendering: pixelated;
    pointer-events: none;
  }
  #char.enter {
    animation: pop 0.45s steps(4, end);
  }
  @keyframes pop {
    0%   { transform: translate(-50%, 12px) scale(0.92); }
    100% { transform: translate(-50%, 0) scale(1); }
  }
  #box {
    position: absolute;
    left: 50%;
    top: 7vh;
    transform: translateX(-50%);
    width: min(92vw, 560px);
    min-height: 92px;
    box-sizing: border-box;
    padding: 18px 20px 22px;
    background: var(--pink);
    border: 4px solid var(--white);
    box-shadow:
      0 0 0 4px var(--pink-dark),
      0 0 0 8px var(--white),
      0 0 0 12px var(--pink-dark),
      6px 6px 0 12px rgba(255, 122, 168, 0.35);
    image-rendering: pixelated;
  }
  #text {
    margin: 0;
    color: var(--white);
    font-size: clamp(11px, 3.2vw, 15px);
    line-height: 1.8;
    text-shadow: 2px 2px 0 var(--pink-dark);
    min-height: 2.2em;
    white-space: normal;
    word-break: break-word;
  }
  #arrow {
    position: absolute;
    right: 16px;
    bottom: 12px;
    width: 0;
    height: 0;
    border-left: 12px solid var(--white);
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    filter: drop-shadow(2px 2px 0 var(--pink-dark));
    animation: nudge 0.7s steps(2, end) infinite;
  }
  #arrow.hidden { visibility: hidden; }
  @keyframes nudge {
    50% { transform: translateX(4px); }
  }
</style>
</head>
<body>
<div id="stage">
  <img id="char" src="assets/scene1_excited.png" alt="">
  <div id="box">
    <p id="text"></p>
    <span id="arrow" class="hidden"></span>
  </div>
</div>
<script>
(function () {
  // Scenes: one line each, with the matching boyfriend pose.
  const LINES = [
    { text: "Yay my baby is here", img: "assets/scene1_excited.png" },
    { text: "cutie I made something for you", img: "assets/scene2_hearts.png" },
    { text: "Aaj kuchh special hai", img: "assets/scene3_standing.png" }
  ];
  const TYPE_MS = 45;

  const charEl = document.getElementById("char");
  const textEl = document.getElementById("text");
  const arrowEl = document.getElementById("arrow");

  let index = 0;
  let timer = null;
  let typed = false;

  function setArrow(show) {
    arrowEl.classList.toggle("hidden", !show);
  }

  function showLine(i) {
    const line = LINES[i];
    typed = false;
    setArrow(false);

    charEl.src = line.img;
    charEl.classList.remove("enter");
    void charEl.offsetWidth;          // restart animation
    charEl.classList.add("enter");

    clearInterval(timer);
    textEl.textContent = "";
    let k = 0;
    timer = setInterval(function () {
      k++;
      textEl.textContent = line.text.slice(0, k);
      if (k >= line.text.length) finishTyping();
    }, TYPE_MS);
  }

  function finishTyping() {
    clearInterval(timer);
    textEl.textContent = LINES[index].text;
    typed = true;
    setArrow(true);
  }

  // Tap anywhere: first finish the text, then go to the next line.
  document.getElementById("stage").addEventListener("pointerdown", function () {
    if (!typed) {
      finishTyping();
      return;
    }
    if (index < LINES.length - 1) {
      index++;
      showLine(index);
    }
  });

  showLine(0);
})();
</script>
</body>
</html>
