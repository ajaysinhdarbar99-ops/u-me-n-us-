<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #ffd6e6; overflow: hidden; }
  #stage {
    position: fixed;
    inset: 0;
    background: url("assets/bg.jpg") center / cover no-repeat;
    image-rendering: pixelated;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #kiss {
    height: 70vh;
    max-width: 92vw;
    object-fit: contain;
    image-rendering: pixelated;
    opacity: 0;
    animation: fadeIn 0.8s steps(6, end) 0.3s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  #mwah {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-family: "Press Start 2P", monospace;
    font-size: clamp(34px, 12vw, 120px);
    color: #ffffff;
    white-space: nowrap;
    text-shadow:
      -0.6vw 0 0 #ff7aa8, 0.6vw 0 0 #ff7aa8,
      0 -0.6vw 0 #ff7aa8, 0 0.6vw 0 #ff7aa8,
      -0.6vw -0.6vw 0 #ff7aa8, 0.6vw -0.6vw 0 #ff7aa8,
      -0.6vw 0.6vw 0 #ff7aa8, 0.6vw 0.6vw 0 #ff7aa8,
      1.2vw 1.2vw 0 #d94b7d;
    animation: mwahPop 1.4s steps(6, end) 1.4s forwards;
  }
  @keyframes mwahPop {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    60%  { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="stage">
  <img id="kiss" src="assets/msg5_kiss.png" alt="">
  <div id="mwah">MWAH</div>
</div>
<script>
  document.getElementById("stage").addEventListener("pointerdown", function () {
    window.location.href = "last.html";
  });
</script>
</body>
</html>
