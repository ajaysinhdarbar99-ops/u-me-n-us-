<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffd6e6;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    background: url("assets/bg.jpg") center / cover no-repeat;
    image-rendering: pixelated;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 4vh 0 2vh;
    box-sizing: border-box;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---- Pink and white message board ---- */
  #box {
    width: min(92vw, 640px);
    box-sizing: border-box;
    padding: 20px 22px 26px;
    background: #ff9fc4;
    border: 4px solid #ffffff;
    box-shadow:
      0 0 0 4px #ff7aa8,
      0 0 0 8px #ffffff,
      0 0 0 12px #ff7aa8,
      6px 6px 0 12px rgba(255, 122, 168, 0.35);
    position: relative;
  }
  #title {
    margin: 0 0 12px;
    font-family: "Press Start 2P", monospace;
    font-size: clamp(11px, 3vw, 15px);
    line-height: 1.6;
    color: #ffffff;
    text-shadow: 2px 2px 0 #ff7aa8;
    text-align: center;
  }
  #text {
    margin: 0;
    min-height: 9em;
    font-family: "Pixelify Sans", "Press Start 2P", monospace;
    font-weight: 500;
    font-size: clamp(15px, 4.1vw, 19px);
    line-height: 1.5;
    color: #ffffff;
    text-shadow: 1px 1px 0 #ff7aa8;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #arrow {
    position: absolute;
    right: 18px;
    bottom: 12px;
    width: 0;
    height: 0;
    border-left: 12px solid #ffffff;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    filter: drop-shadow(2px 2px 0 #ff7aa8);
    animation: nudge 0.7s steps(2, end) infinite;
  }
  #arrow.hidden { visibility: hidden; }
  @keyframes nudge { 50% { transform: translateX(4px); } }

  /* ---- Picture at the bottom ---- */
  #mic {
    height: 52vh;
    max-width: 92vw;
    object-fit: contain;
    image-rendering: pixelated;
    opacity: 0;
    animation: fadeIn 0.8s steps(6, end) 0.4s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
</style>
</head>
<body>
<div id="stage">
  <div id="box">
    <p id="title">HAPPY ANNIVERSARY</p>
    <p id="text"></p>
    <span id="arrow" class="hidden"></span>
  </div>
  <img id="mic" src="assets/msg4_gift.png" alt="">
</div>
<script>
(function () {
  const MESSAGE =
    "Aapke liye gift hai";
  const TYPE_MS = 38;

  const textEl = document.getElementById("text");
  const arrowEl = document.getElementById("arrow");
  const stage = document.getElementById("stage");

  let k = 0;
  let typed = false;
  let timer = null;

  function finish() {
    clearInterval(timer);
    textEl.textContent = MESSAGE;
    typed = true;
    arrowEl.classList.remove("hidden");
  }

  timer = setInterval(function () {
    k++;
    textEl.textContent = MESSAGE.slice(0, k);
    if (k >= MESSAGE.length) finish();
  }, TYPE_MS);

  // Tap anywhere to finish the typing instantly
  stage.addEventListener("pointerdown", function () {
    if (!typed) finish();
    else window.location.href = "message5.html";
  });
})();
</script>
</body>
</html>
